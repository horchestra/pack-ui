name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# arenadata/oci-packer and horchestra/pack are not on proxy.golang.org,
# fetch them straight from github.
env:
  GOPRIVATE: github.com/arenadata/*,github.com/horchestra/*

jobs:
  pack-ui:
    name: pack-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # the SPA lands in web/dist, the go binary embeds it
      - name: web
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test

      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          test -z "$out" || { echo "gofmt:"; echo "$out"; exit 1; }
      - name: go
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
